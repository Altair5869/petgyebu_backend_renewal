spring:
  application:
    name: petgyebu_backend_renewal
  datasource:
    hikari:
      # 풀(운영 인스턴스당 3)이 모두 사용 중일 때 연결을 기다리는 최대 시간. 밀리초 단위(Hikari 기본 30초).
      # 오래 매달리지 않고 5초 뒤 공통 500 INTERNAL_ERROR로 빨리 실패한다.
      connection-timeout: 5000

petgyebu:
  jwt:
    secret: ${PETGYEBU_JWT_SECRET:}
  social:
    kakao:
      app-id: ${PETGYEBU_KAKAO_APP_ID:}
    google:
      client-ids: ${PETGYEBU_GOOGLE_CLIENT_IDS:}
